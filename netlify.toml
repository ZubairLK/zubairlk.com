[build]
  command = "echo 'Static site: no build required'"
  publish = "site"

[[redirects]]
  from = "https://www.zubairlk.com/*"
  to = "https://zubairlk.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
