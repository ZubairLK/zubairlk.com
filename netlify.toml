[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[[redirects]]
  from = "https://www.zubairlk.com/*"
  to = "https://zubairlk.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
